plugins {
    id 'java-library'
    id 'jacoco'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}_${version}.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', '**/.cache/**')
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            if (project.hasProperty('kidayClientSmokeTest')) {
                systemProperty 'create_kiday.clientSmokeTest', 'true'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        endToEndServer {
            type = 'gameTestServer'
            gameDirectory = file('run/e2e')
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id}_e2e"
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        // The published POM exposes Create's development-only compatibility mods as
        // runtime dependencies. The release jar already carries its required libraries.
        transitive = false
    }
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    compileOnly("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test).configure { useJUnitPlatform() }

jacoco { toolVersion = '0.8.12' }
tasks.named('test', Test).configure { finalizedBy tasks.named('jacocoTestReport') }
tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn 'test', 'unitTest', 'integrationTest', 'resourceValidationTest'
    executionData.from(fileTree(layout.buildDirectory.dir('jacoco')) { include '*.exec' })
    reports { xml.required = true; html.required = true }
}

tasks.register('unitTest', Test) {
    group = 'verification'
    description = 'Runs deterministic unit tests for pure logic and registries.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/KidayBalanceTest.class', '**/SalurBalanceTest.class', '**/LeiGongBalanceTest.class', '**/StormGroveBossDataTest.class'
}
tasks.register('validateResources', Exec) {
    group = 'verification'
    description = 'Validates JSON syntax, registry references, models, textures, translations, and removed IDs.'
    commandLine 'python3', 'tools/validate_resources.py'
}
tasks.register('textureDeterminism', Exec) {
    group = 'verification'
    description = 'Verifies that checked-in pixel texture scripts produce identical PNGs on repeated runs.'
    commandLine 'python3', 'tools/check_texture_determinism.py'
}
tasks.register('resourceValidationTest', Test) {
    group = 'verification'
    description = 'Runs packaged JSON, texture, model, translation, and resource checks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ResourceDistinctnessTest.class'
    dependsOn tasks.named('validateResources'), tasks.named('textureDeterminism')
}
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs integration checks for registered products and resource-backed production flows.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IntegrationTest.class'
}
tasks.register('gameTests') {
    group = 'verification'
    description = 'Runs NeoForge Minecraft GameTests.'
    dependsOn tasks.named('runGameTestServer')
}
tasks.register('smokeTest') {
    group = 'verification'
    description = 'Runs fast compilation and resource-processing checks.'
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
}
tasks.register('endToEndTest') {
    group = 'verification'
    description = 'Runs the isolated end-to-end metallurgy GameTests.'
    dependsOn tasks.named('runEndToEndServer')
}
tasks.register('regressionTest') {
    group = 'verification'
    description = 'Runs the complete JUnit regression suite.'
    dependsOn tasks.named('test')
}
tasks.register('allTests') {
    group = 'verification'
    description = 'Runs unit, integration, GameTest, and packaged resource validation.'
    dependsOn tasks.named('unitTest'), tasks.named('integrationTest'), tasks.named('resourceValidationTest'),
            tasks.named('gameTests'), tasks.named('endToEndTest'), tasks.named('textureDeterminism'),
            tasks.named('jacocoTestReport')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version_range: minecraft_version_range, neo_version: neo_version, loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
