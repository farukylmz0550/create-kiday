name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install texture tooling
        run: python -m pip install Pillow==12.3.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test groups, smoke checks, and coverage
        run: ./gradlew build allTests smokeTest
      - name: Store test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-kiday-test-reports
          path: |
            build/reports/tests/**
            build/reports/jacoco/**
            build/test-results/**
          if-no-files-found: warn
